apiVersion: v1
kind: Namespace
metadata:
  name: otel-demo
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: my-otel-demo
  namespace: otel-demo
spec:
  repo: https://open-telemetry.github.io/opentelemetry-helm-charts
  chart: opentelemetry-demo
  targetNamespace: otel-demo
  valuesContent: |-
    components:
      frontendProxy:
        ingress:
          enabled: true
          annotations: {}
          hosts:
            - host: otel-demo.localhost
              paths:
                - path: /
                  pathType: Prefix
                  port: 8080
    opentelemetry-collector:
      mode: daemonset
      service:
        # enabled: false # this is supposed to be false when mode == daemonset
        # v-- There's a bug in the chart which causes this to throw a comparison error if not set explicitly
        internalTrafficPolicy: "Local"

      image:
        repository: "otel/opentelemetry-collector-contrib"

      command:
        name: "otelcol-contrib"

      presets:
        logsCollection:
          enabled: true
        kubernetesAttributes:
          enabled: true
        kubeletMetrics:
          enabled: true
        hostMetrics:
          enabled: true
